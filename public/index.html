<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat with PDF</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #0f1115;
    --bg-elev: #161a22;
    --bg-elev-2: #1d2230;
    --border: #262b38;
    --text: #e6e8ee;
    --text-dim: #8b91a3;
    --accent: #6366f1;
    --accent-hover: #7c7ff3;
    --user-bubble: #6366f1;
    --assistant-bubble: #1d2230;
    --success: #22c55e;
    --danger: #ef4444;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header p {
    color: var(--text-dim);
    margin-top: 6px;
    font-size: 14px;
  }

  section {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  section h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
  }

  /* ---- Upload ---- */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }

  .drop-zone:hover,
  .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(99, 102, 241, 0.05);
  }

  .drop-zone .icon {
    font-size: 36px;
    margin-bottom: 8px;
  }

  .drop-zone p {
    color: var(--text-dim);
    font-size: 14px;
  }

  .drop-zone input[type="file"] {
    display: none;
  }

  .file-info {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-dim);
    display: none;
  }

  .file-info.show {
    display: block;
  }

  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 14px;
    transition: background 0.2s;
    font-family: inherit;
  }

  .btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ---- Status messages ---- */
  .status {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }

  .status.show {
    display: block;
  }

  .status.success {
    background: rgba(34, 197, 94, 0.1);
    color: var(--success);
    border: 1px solid rgba(34, 197, 94, 0.25);
  }

  .status.error {
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.25);
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ---- Chat ---- */
  .chat-container {
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .chat-container.active {
    opacity: 1;
    pointer-events: auto;
  }

  .chat-messages {
    height: 420px;
    overflow-y: auto;
    padding: 10px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chat-messages::-webkit-scrollbar {
    width: 6px;
  }

  .chat-messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    align-self: flex-start;
    padding-left: 4px;
  }

  .msg.user + .msg-meta {
    align-self: flex-end;
    padding-left: 0;
    padding-right: 4px;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .chat-input {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .chat-input input {
    flex: 1;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .chat-input input:focus {
    border-color: var(--accent);
  }

  .chat-input input:disabled {
    opacity: 0.5;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat with PDF</h1>
    <p>Upload a PDF and ask questions about its content</p>
  </header>

  <section>
    <h2>1. Upload PDF</h2>
    <label for="pdf-input" class="drop-zone" id="drop-zone">
      <div class="icon">📄</div>
      <p><strong>Click to choose</strong> or drag &amp; drop a PDF here</p>
      <input type="file" id="pdf-input" accept="application/pdf" />
    </label>
    <div class="file-info" id="file-info"></div>
    <button class="btn" id="upload-btn" disabled>Upload &amp; Process</button>
    <div class="status" id="upload-status"></div>
  </section>

  <section>
    <h2>2. Chat</h2>
    <div class="chat-container" id="chat-container">
      <div class="chat-messages" id="chat-messages"></div>
      <form class="chat-input" id="chat-form">
        <input
          type="text"
          id="question-input"
          placeholder="Ask a question about your PDF..."
          autocomplete="off"
        />
        <button type="submit" class="btn" id="send-btn">Send</button>
      </form>
    </div>
  </section>
</div>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('pdf-input');
  const fileInfo = document.getElementById('file-info');
  const uploadBtn = document.getElementById('upload-btn');
  const uploadStatus = document.getElementById('upload-status');
  const chatContainer = document.getElementById('chat-container');
  const chatMessages = document.getElementById('chat-messages');
  const chatForm = document.getElementById('chat-form');
  const questionInput = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');

  let selectedFile = null;
  let pdfReady = false;

  // ---- File selection ----
  dropZone.addEventListener('click', (e) => {
    if (e.target.tagName !== 'INPUT') fileInput.click();
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  ['dragenter', 'dragover'].forEach((evt) => {
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach((evt) => {
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
    });
  });

  dropZone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') handleFile(file);
    else showStatus('Please drop a PDF file.', 'error');
  });

  function handleFile(file) {
    selectedFile = file;
    const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
    fileInfo.textContent = `Selected: ${file.name} (${sizeMB} MB)`;
    fileInfo.classList.add('show');
    uploadBtn.disabled = false;
    uploadStatus.classList.remove('show');
  }

  // ---- Upload ----
  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    uploadBtn.disabled = true;
    showStatus('<span class="spinner"></span>Processing PDF — this may take a moment...', 'success');

    const formData = new FormData();
    formData.append('pdf', selectedFile);

    try {
      const res = await fetch('/upload', { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Upload failed');

      showStatus(`✅ PDF processed! ${data.chunksProcessed} chunks indexed.`, 'success');
      enableChat();
    } catch (err) {
      showStatus(`❌ ${err.message}`, 'error');
      uploadBtn.disabled = false;
    }
  });

  function showStatus(msg, type) {
    uploadStatus.innerHTML = msg;
    uploadStatus.className = `status show ${type}`;
  }

  // ---- Chat ----
  function enableChat() {
    pdfReady = true;
    chatContainer.classList.add('active');
    questionInput.disabled = false;
    sendBtn.disabled = false;
    questionInput.focus();
    addMessage('assistant', 'Hi! Ask me anything about your PDF.');
  }

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = questionInput.value.trim();
    if (!question || !pdfReady) return;

    addMessage('user', question);
    questionInput.value = '';
    setChatBusy(true);

    const typingEl = addMessage('assistant', '<div class="typing"><span></span><span></span><span></span></div>');
    let metaEl = null;

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Failed to get answer');

      typingEl.querySelector('.msg-body') ? typingEl.querySelector('.msg-body').textContent = data.answer : null;
      typingEl.innerHTML = '';
      const body = document.createElement('div');
      body.className = 'msg-body';
      body.textContent = data.answer;
      typingEl.appendChild(body);

      metaEl = document.createElement('div');
      metaEl.className = 'msg-meta';
      metaEl.textContent = `Based on ${data.sourcesCount} chunks from your PDF`;
      chatMessages.appendChild(metaEl);
      scrollToBottom();
    } catch (err) {
      typingEl.innerHTML = '';
      const body = document.createElement('div');
      body.className = 'msg-body';
      body.textContent = `❌ ${err.message}`;
      typingEl.appendChild(body);
    } finally {
      setChatBusy(false);
      questionInput.focus();
    }
  });

  function addMessage(role, content) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    if (content.includes('<div class="typing">') || role === 'user') {
      const body = document.createElement('div');
      body.className = 'msg-body';
      if (content.startsWith('<')) {
        body.innerHTML = content;
      } else {
        body.textContent = content;
      }
      msg.appendChild(body);
    } else {
      const body = document.createElement('div');
      body.className = 'msg-body';
      body.textContent = content;
      msg.appendChild(body);
    }
    chatMessages.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function setChatBusy(busy) {
    questionInput.disabled = busy || !pdfReady;
    sendBtn.disabled = busy || !pdfReady;
  }

  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
</script>
</body>
</html>
